[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudforge"]

[project]
name = "cloudforge"
version = "0.1.0"
description = "Cloud infrastructure-native coding agent — pipelines, IaC, security, observability"
requires-python = ">=3.12"
dependencies = [
    # Agent core
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    # GitHub integration
    "pygithub>=2.4.0",
    "githubkit>=0.12.0",
    # Cloud SDKs
    "boto3>=1.35.0",
    "google-cloud-logging>=3.11.0",
    "azure-monitor-query>=1.4.0",
    "oci>=2.130.0",
    # IaC tooling (subprocess wrappers)
    "python-hcl2>=4.3.4",
    "checkov>=3.2.0",
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    # Utilities
    "typer[all]>=0.13.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "localstack>=3.8.0",
]

[project.scripts]
cloudforge = "cloudforge.interfaces.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
